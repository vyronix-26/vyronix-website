<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRONIX Sign Up</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/signup.css">
  
</head>
<body>

<div class="container">

    <div class="logo-section">
    </div>

    <div class="card">

        <h1 class="card-title">Sign Up</h1>

        <form>
            <div class="form-group">
                <input type="text" class="form-input" placeholder="First Name" required>
            </div>
            <div class="form-group">
                <input type="text" class="form-input" placeholder="Last Name" required>
            </div>
            <div class="form-group">
                <input type="email" class="form-input" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-input" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-input" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-login">Sign Up</button>
        </form>

       

        <p class="signup-text">
            Already have an account? <a href="LogIn.html" class="signup-link">Sign In</a>
        </p>

    </div>

</div>

</body>
</html>
