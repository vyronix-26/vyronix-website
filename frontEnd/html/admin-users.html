<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Users</title>

  <link rel="stylesheet" href="../css/AdminHomePage.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<div class="shell">

<aside class="sidebar">
  <div class="sidebar-logo">
    <span class="dot">⚡</span>
    AdminPro
  </div>

  <div class="nav-section">
    <div class="nav-label">Main</div>

    <div class="nav-item" onclick="window.location.href='AdminHomePage.html'">
      <i class="bi bi-grid-1x2-fill"></i>
      Dashboard
    </div>

    <div class="nav-item active" onclick="window.location.href='admin-users.html'">
      <i class="bi bi-people-fill"></i>
      Users
    </div>

    <div class="nav-item" onclick="window.location.href='AdminProjects.html'">
      <i class="bi bi-folder-fill"></i>
      Projects
    </div>

    <div class="nav-item" onclick="window.location.href='AdminRequest.html'">
      <i class="bi bi-file-earmark-text-fill"></i>
      Requests
    </div>
  </div>
</aside>
  </aside>

  <div class="main">

    <header class="topbar">
      <div class="search-box">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="userSearch" placeholder="Search users..." />
      </div>

      <div class="topbar-right">
        <div class="notif-menu" id="notifMenu" style="display:none;">
          <button type="button" class="header-icon-btn" id="notifBtn" aria-label="Open Notifications">
            <i class="bi bi-bell"></i>
            <span class="notif-dot" id="notifDot"></span>
          </button>

          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-header">
              <h4>Notifications</h4>
              <a href="#" class="notif-clear" id="notifClear">Mark all read</a>
            </div>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>

        <div class="user-chip">
          <div class="avatar" id="topbarAvatar" onclick="window.location.href='AdminProfilePage.html'">A</div>
          <div class="user-info">
            <div class="user-name" id="topbarName">Admin</div>
            <div class="user-role" id="topbarRole">Users Manager</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div>
          <h1>Users Management</h1>
          <p>View users, update roles, and manage account status.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">All Users</div>
        </div>

        <table class="tbl">
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Change Role</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="usersTableBody">
            <tr>
              <td colspan="6">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin-users.js"></script>
<script src="../js/admin-topbar.js"></script>
</body>
</html>
