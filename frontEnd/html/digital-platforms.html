    <script>
        // User dropdown toggle
        const userBadge = document.getElementById('userBadge');
        const userDropdown = document.getElementById('userDropdown');

        userBadge.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', () => {
            userDropdown.classList.remove('active');
        });

        // Prevent closing when clicking inside dropdown
        userDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
    <script>
        // Fetch digital platforms from the database
        async function fetchDigitalPlatforms() {
            try {
                const response = await fetch('http://localhost:3000/api/digital-platforms');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const platforms = await response.json();
                displayPlatforms(platforms);
            } catch (error) {
                console.error('Error fetching digital platforms:', error);
            }
        }


    function displayPlatforms(platforms) {
        if (platforms.length === 0) {
            const digitalGrid = document.getElementById('digitalGrid');
            digitalGrid.innerHTML = '<p>No digital platforms available at the moment.</p>';
            return;
        }
    const grid = document.getElementById('digitalGrid');
    grid.innerHTML = '';
    platforms.forEach(platform => {
        const platformCard = document.createElement('article');
        platformCard.classList.add('digital-card');
        platformCard.innerHTML = `
            <img src="${platform.image}" alt="${platform.name}">
            <h3>${platform.name}</h3>
            <p class="card-desc">
                ${platform.description}
            </p>
            <div class="card-actions">
                <a href="${platform.github}" target="_blank" class="btn github">
                    GitHub
                </a>
                <a href="${platform.liveDemo}" target="_blank" class="btn live">
                    Live Demo
                </a>
            </div>
        `;

        grid.appendChild(platformCard);
    });
}

        // Call the function to fetch and display platforms on page load
        fetchDigitalPlatforms();
    </script>
