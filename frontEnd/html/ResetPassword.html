<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRONIX | Reset Password</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="../css/ResetPassword.css">
</head>
<body>

<div class="container">

    <!-- ===== LOGO SECTION ===== -->
    <div class="logo-section">
        <img src="../assets/images/logo.png" alt="VYRONIX Logo" class="logo-icon">
        <span class="brand-name">VYRONIX</span>
    </div>

    <!-- ===== RESET PASSWORD CARD ===== -->
    <div class="card">

        <h1 class="card-title">Reset<br>Password</h1>

        <p class="subtitle-text">
            Enter a new password for your account below.
        </p>

        <!-- method="post" is a safety net: if JS fails, the browser will
             still issue a POST instead of leaking password values in the URL -->
        <form id="resetPasswordForm" method="post" autocomplete="off">
            <div class="form-group">
                <input type="password" name="password" id="password" class="form-input" placeholder="New password" minlength="8" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <input type="password" name="confirmPassword" id="confirmPassword" class="form-input" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Reset Password</button>
        </form>

        <p id="formMessage" class="form-message" role="status"></p>

        <p class="signup-text back-to-login">
            Remembered your password? <a href="Login.html" class="signup-link">Log in</a>
        </p>

    </div>

</div>


<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    console.log("URL params:", params.toString()); // Log the URL parameters for debugging
    const token = localStorage.getItem("resetToken") || params.get("token"); // ONLY from the URL, no localStorage fallback
        console.log("Reset token:", token); // Log the reset token for debugging
    const messageEl = document.getElementById("formMessage");
    const form = document.getElementById("resetPasswordForm");
    const submitBtn = document.getElementById("submitBtn");

    // Strip all query params from the visible URL/history immediately, so
    // they don't linger in browser history or get re-shared accidentally.
    // This also removes accidental password/query values from bad redirects.
    if (window.location.search) {
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
    }

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.classList.remove("success", "error");
        messageEl.classList.add(type);
    }

    // No token at all -> malformed/expired link, disable the form entirely
    if (!token) {
        showMessage("This reset link is invalid or missing a token.", "error");
        form.querySelectorAll("input, button").forEach(el => el.disabled = true);
        return; // don't even attach the submit handler
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        messageEl.textContent = "";
        messageEl.classList.remove("success", "error");

        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        if (password.length < 8) {
            showMessage("Password must be at least 8 characters.", "error");
            return;
        }

        const API_BASE = "http://localhost:5000/api/auth";

        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting...";
console.log({
    token,
    password,
     confirmPassword: password
});
        try {
            const res = await fetch(`${API_BASE}/reset-password`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
  token,
  password,
  confirmPassword: password
})
            });

            const result = await res.json();

            if (res.ok) {
                showMessage(result.message || "Password reset successfully!", "success");
                form.reset();
                form.querySelectorAll("input, button").forEach(el => el.disabled = true);
                setTimeout(() => {
                    window.location.href = "Login.html";
                }, 2000);
            } else {
                showMessage(result.message || "Invalid or expired reset token.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password";
            }

        } catch (err) {
            console.error(err);
            showMessage("Server error. Please try again later.", "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset Password";
        }
    });
})();
</script>

</body>
</html>
