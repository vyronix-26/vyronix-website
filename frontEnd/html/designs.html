<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
 <header class="header">
    <a href="index.html" class="header-logo">
        <img src="../assets/images/logo.png" alt="VYRONIX Logo">
        <span>VYRONIX</span>
    </a>

    <nav class="navbar" id="navbar">
        <a href="index.html#home">Home</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#projects">Projects</a>
        <a href="ourteam.html">Our Team</a>
        <a href="contact.html">Contact</a>
    </nav>

   <div class="header-actions">
        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search">
        </div>

        <div class="header-action-icons">
            <button class="header-icon-btn" aria-label="Messages">
                <i class="bi bi-envelope"></i>
            </button>

            <button class="header-icon-btn" aria-label="Notifications">
                <i class="bi bi-bell"></i>
            </button>
        </div>

        <div class="header-divider"></div>

        <div class="profile-menu">
            <button class="user-avatar" id="profileBtn" aria-label="Open Profile Menu">R</button>

            <div class="profile-dropdown" id="profileDropdown">
                <div class="profile-head">
                    <img src="../assets/images/user.jpg" alt="User Profile">
                    <div>
                        <h4>VYRONIX User</h4>
                        <p>user@vyronix.com</p>
                    </div>
                </div>

                <a href="#">
                    <span><i class="bi bi-person"></i> Profile</span>
                    <i class="bi bi-chevron-right"></i>
                </a>

                <a href="#">
                    <span><i class="bi bi-star"></i> Ratings & Feedback</span>
                    <i class="bi bi-chevron-right"></i>

                <a href="#">
                    <span><i class="bi bi-person-plus"></i> Add Account</span>
                    <i class="bi bi-chevron-right"></i>
                </a>

                <button class="logout-btn">
                    <span><i class="bi bi-box-arrow-right"></i> Log Out</span>
                </button>
            </div>
        </div>
    </div>

    <button class="menu-btn" id="menuBtn" aria-label="Open Menu">
        <i class="bi bi-list"></i>
    </button>
</header>

  <!-- Getting the designs from the database not a static list -->
    <div class="digital-grid" id="digitalGrid">
    </div>
    
    <button class="chat-btn"><img src="../assets/images/chatbot.png" alt="Chat Bot"></button>
    <script src="../js/main.js"></script>
    <script>
        // User dropdown toggle
        const userBadge = document.getElementById('userBadge');
        const userDropdown = document.getElementById('userDropdown');

        userBadge.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', () => {
            userDropdown.classList.remove('active');
        });

        // Prevent closing when clicking inside dropdown
        userDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
    <script>
        // Fetch designs from the database
        async function fetchDesigns() {
            try {
                const response = await fetch('http://localhost:3000/designs');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const designs = await response.json();
                displayDesigns(designs);
            } catch (error) {
                console.error('Error fetching designs:', error);
            }
      
            displayDesigns(designs);

        }

        function displayDesigns(designs) {
            //check if designs empty
            if (designs.length === 0) {
                const digitalGrid = document.getElementById('digitalGrid');
                digitalGrid.innerHTML = '<p>No designs available at the moment.</p>';
                return;
            }
            const digitalGrid = document.getElementById('digitalGrid');
            digitalGrid.innerHTML = ''; // Clear existing content
            designs.forEach(design => {
                const designCard = document.createElement('article');
                designCard.classList.add('digital-card');
                designCard.innerHTML = `
                   <img src="${design.image}" alt="${design.name}">
                   <h3>${design.name}</h3>
                   <p class="card-desc">
                   ${design.description}
                   </p>
                   <div class="card-actions">
                   <a href="${design.github}" target="_blank" class="btn github">
                      GitHub
                   </a>
                   <a href="${design.liveDemo}" target="_blank" class="btn live">
                     Live Demo
                   </a>
                </div>
                    `;

                digitalGrid.appendChild(designCard);
            });
        }

        // Call the function to fetch and display designs on page load
        fetchDesigns();
    </script>
</body>
</html>
