<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRONIX Login</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/Login.css">
</head>
<body>

<div class="container">

    <!-- ===== LOGO SECTION - TIGHT SPACING ===== -->
    <div class="logo-section">
        <img src="../assets/images/logo.png" alt="VYRONIX Logo" class="logo-icon">
        <span class="brand-name">VYRONIX</span>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="card">

        <h1 class="card-title">Log in</h1>

        <form>
            <div class="form-group">
                <input type="email" class="form-input" placeholder="Email" required>
            </div>

            <div class="form-group">
                <input type="password" class="form-input" placeholder="Password" required>
            </div>

            <div class="options-row">
                <label class="remember-label">
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">Log in</button>
        </form>

        <p class="divider-text">Or Sign In With</p>

        <div class="social-icons">
            <a href="#" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" aria-label="Google/Email">
                <i class="fa-brands fa-google"></i>
            </a>
            <a href="#" aria-label="Apple">
                <i class="fa-brands fa-apple"></i>
            </a>
        </div>

        <p class="signup-text">
            Don't have an account? <a href="#" class="signup-link">Sign Up</a>
        </p>

    </div>

</div>

</body>
</html>
